<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cook AI - Smart Zero-Waste Kitchen & Meal Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            orange: {
              50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74',
              400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c',
              800: '#9a3412', 900: '#7c2d12'
            },
            amber: {
              50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 400: '#fbbf24',
              500: '#f59e0b', 600: '#d97706', 700: '#b45309'
            },
            stone: {
              50: '#fafaf9', 100: '#f5f5f4', 200: '#e7e5e4', 800: '#292524', 900: '#1c1917', 950: '#0c0a09'
            }
          },
          boxShadow: {
            'card': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03)',
            'card-hover': '0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04)',
            'warm-glow': '0 0 25px -4px rgba(234, 88, 12, 0.35)',
            'gold-glow': '0 0 20px -3px rgba(245, 158, 11, 0.35)',
          }
        }
      }
    }
  </script>
  <!-- React & Babel for zero-build execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Sign-In SDK (GIS) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#FAF8F5] text-stone-900 antialiased min-h-screen pb-28 md:pb-16 selection:bg-orange-100 selection:text-orange-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DIET_OPTIONS = [
      { id: 'both', label: '🍽️ Both', icon: '🍽️', desc: 'Any cuisine' },
      { id: 'veg', label: '🥦 Vegetarian', icon: '🥦', desc: 'No meat, fish or egg' },
      { id: 'vegan', label: '🥑 100% Vegan', icon: '🥑', desc: 'No dairy, eggs or honey' },
      { id: 'non_veg', label: '🍗 Non-veg', icon: '🍗', desc: 'Includes meat or seafood' },
    ];

    const MEAL_OPTIONS = ['Any', 'Breakfast', 'Lunch', 'Dinner', 'Snacks'];
    const SPICE_OPTIONS = [
      { id: 'Mild', label: 'Mild 🌿' },
      { id: 'Medium', label: 'Medium 🌶️' },
      { id: 'Spicy', label: 'Spicy 🔥' }
    ];

    const COMMON_ESSENTIALS = [
      'salt', 'black pepper', 'cooking oil', 'water', 'sugar', 'cumin',
      'turmeric', 'chilli powder', 'paprika', 'oregano', 'garlic powder', 'soy sauce', 'vinegar'
    ];

    function App() {
      const [tab, setTab] = useState('cook'); // 'cook', 'kitchen', 'shopping', 'history'
      const [kitchenTab, setKitchenTab] = useState('pantry'); // 'pantry', 'essentials', 'dishes', 'restricted'
      const [pantryFilter, setPantryFilter] = useState('all');
      const [loading, setLoading] = useState(true);
      const [suggesting, setSuggesting] = useState(false);
      const [user, setUser] = useState(null);
      const [config, setConfig] = useState(null);
      const [data, setData] = useState({
        pantry: [], essential: [], prohibited: [], dishes: [], shopping: [],
        diet: 'both', usage_today: 0, stats: { rescued_count: 0, money_saved: 0 },
        expiring_soon: [], remaining_today: 10
      });

      // Recipe generator states
      const [diet, setDiet] = useState('both');
      const [meal, setMeal] = useState('Any');
      const [prompt, setPrompt] = useState('');
      const [servings, setServings] = useState(2);
      const [spiceLevel, setSpiceLevel] = useState('Medium');
      const [kidFriendly, setKidFriendly] = useState(false);
      const [results, setResults] = useState(null);

      // Modals
      const [activeRecipe, setActiveRecipe] = useState(null);
      const [cookedModal, setCookedModal] = useState(null);
      const [editPantryItem, setEditPantryItem] = useState(null);
      const [editDishItem, setEditDishItem] = useState(null);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [feedbackOpen, setFeedbackOpen] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = (msg, icon = '✓') => {
        setToast({ msg, icon });
        setTimeout(() => setToast(null), 3500);
      };

      // Auth guard helper: returns true if logged in, otherwise opens AuthModal
      const requireAuth = (actionDescription = 'make changes') => {
        if (!user || !user.is_logged_in) {
          setAuthModalOpen(true);
          showToast(`Sign in with Google is required to ${actionDescription}.`, '🔒');
          return false;
        }
        return true;
      };

      const fetchKitchen = async () => {
        try {
          const res = await fetch('/api/kitchen');
          const json = await res.json();
          setData(json);
          setDiet(json.diet || 'both');
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchKitchen();
        fetch('/api/config')
          .then(r => r.json())
          .then(cfg => setConfig(cfg))
          .catch(() => {});
        fetch('/api/user')
          .then(r => r.json())
          .then(u => setUser(u))
          .catch(() => {});
      }, []);

      window.handleGoogleCredentialResponse = async (response) => {
        try {
          const res = await fetch('/api/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: response.credential })
          });
          const json = await res.json();
          if (json.status === 'ok') {
            setUser({ ...json, is_logged_in: true });
            setAuthModalOpen(false);
            fetchKitchen();
            showToast(`Signed in as ${json.name}! Kitchen synced with Gmail ☁️`);
          } else {
            showToast('Could not sign in with Google.', '❌');
          }
        } catch (e) {
          showToast('Google login error.', '❌');
        }
      };

      const handleLogout = async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        setUser({ is_logged_in: false, name: 'Guest Cook' });
        showToast('Signed out from Google');
        fetchKitchen();
      };

      const handleDevLogin = async (emailToUse) => {
        try {
          const res = await fetch('/api/auth/dev', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailToUse || 'shama@gmail.com' })
          });
          const json = await res.json();
          if (json.status === 'ok') {
            setUser({ ...json, is_logged_in: true });
            setAuthModalOpen(false);
            fetchKitchen();
            showToast(`Signed in as ${json.name}! Kitchen synced ☁️`);
          } else {
            showToast('Could not sign in.', '❌');
          }
        } catch (e) {
          showToast('Sign-in error.', '❌');
        }
      };

      useEffect(() => {
        if (config && config.google_client_id && (!user || !user.is_logged_in)) {
          const timer = setInterval(() => {
            if (window.google && window.google.accounts && window.google.accounts.id) {
              clearInterval(timer);
              window.google.accounts.id.initialize({
                client_id: config.google_client_id,
                callback: window.handleGoogleCredentialResponse,
                auto_select: false,
              });
              const btn = document.getElementById('google-signin-btn');
              if (btn) {
                window.google.accounts.id.renderButton(btn, {
                  theme: 'outline',
                  size: 'medium',
                  shape: 'pill',
                  text: 'signin_with',
                });
              }
            }
          }, 300);
          return () => clearInterval(timer);
        }
      }, [config, user]);

      const handleDietChange = async (newDiet) => {
        if (!requireAuth('change dietary preference')) return;
        setDiet(newDiet);
        await fetch('/api/diet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ diet: newDiet })
        });
        showToast(`Diet set to ${newDiet}`);
      };

      const handleSuggest = async () => {
        if (!data.pantry.length) {
          showToast('Add ingredients to your pantry first!', '⚠️');
          setTab('kitchen');
          return;
        }
        setSuggesting(true);
        try {
          const res = await fetch('/api/suggest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              meal, prompt, servings, spice_level: spiceLevel, kid_friendly: kidFriendly
            })
          });
          const json = await res.json();
          setResults(json);
          fetchKitchen();
        } catch (e) {
          showToast('Could not fetch suggestions right now.', '❌');
        } finally {
          setSuggesting(false);
        }
      };

      const handleRecordCooked = async (dishName, source, usedIds) => {
        if (!requireAuth('save cooked meal to history')) return;
        try {
          const res = await fetch('/api/history/cooked', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dish_name: dishName, source, used_item_ids: usedIds })
          });
          const json = await res.json();
          setCookedModal(null);
          setActiveRecipe(null);
          showToast(json.rescued_count > 0 ? `Cooked! Rescued ${json.rescued_count} item(s) 🌱` : 'Meal saved to history! 🍽️');
          fetchKitchen();
        } catch (e) {
          showToast('Failed to save to history.', '❌');
        }
      };

      if (loading) {
        return (
          <div className="flex h-screen items-center justify-center bg-[#FAF8F5]">
            <div className="text-center space-y-3">
              <div className="w-14 h-14 rounded-2xl bg-orange-500/10 border border-orange-500/20 text-orange-600 flex items-center justify-center text-3xl mx-auto animate-bounce">
                🍳
              </div>
              <p className="text-sm font-bold text-stone-800">Loading your smart kitchen…</p>
              <p className="text-xs text-stone-400">Zero-waste AI meal assistant</p>
            </div>
          </div>
        );
      }

      const expiringCount = data.expiring_soon ? data.expiring_soon.length : 0;
      const unboughtShoppingCount = data.shopping.filter(i => !i.bought).length;

      return (
        <div className="w-full max-w-[1720px] mx-auto px-4 sm:px-8 lg:px-12 xl:px-14 pt-5 pb-16">
          {/* =============================================================== */}
          {/* HEADER: Sleek Navbar with Warm Terracotta/Ember Cook AI Brand   */}
          {/* =============================================================== */}
          <header className="flex flex-col lg:flex-row lg:items-center justify-between pb-6 border-b border-stone-200/80 mb-6 gap-4">
            {/* Left: Warm Cast-Iron & Terracotta Cook AI Brand Block */}
            <div className="flex items-center gap-3.5 sm:gap-4 p-2.5 sm:p-3 pr-6 sm:pr-8 rounded-2xl bg-gradient-to-r from-stone-950 via-[#231713] to-[#361910] border border-orange-500/35 shadow-md">
              <div className="w-12 h-12 sm:w-14 sm:h-14 rounded-xl bg-gradient-to-tr from-amber-500 via-orange-500 to-rose-600 text-white flex items-center justify-center text-3xl sm:text-4xl shadow-warm-glow flex-shrink-0">
                🍳
              </div>
              <div>
                <div className="flex items-center gap-2.5">
                  <h1 className="text-2xl sm:text-3xl font-black tracking-tight text-white">Cook AI</h1>
                  <span className="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-amber-400 text-stone-950 shadow-sm">
                    Free
                  </span>
                </div>
                <p className="text-[11px] sm:text-xs font-semibold text-orange-200/90 mt-0.5 hidden sm:block">
                  Smart Zero-Waste Kitchen & AI Recipes
                </p>
              </div>
            </div>

            {/* Right: Actions, Cart & Google Sign-in */}
            <div className="flex flex-wrap items-center gap-3">
              {/* Back to Home / Landing Page */}
              <a
                href="/"
                className="px-3.5 py-2.5 rounded-2xl border border-stone-200 bg-white hover:bg-stone-50 transition shadow-card flex items-center gap-1.5 text-xs font-bold text-stone-700 active:scale-95"
                title="View Cook AI overview and information"
              >
                <span>←</span>
                <span>About</span>
              </a>

              {/* Feedback to Developer */}
              <button
                onClick={() => setFeedbackOpen(true)}
                className="px-3.5 py-2.5 rounded-2xl border border-stone-200 bg-white hover:bg-stone-50 transition shadow-card flex items-center gap-1.5 text-xs font-bold text-stone-700 active:scale-95"
                title="Send feedback directly to developer"
              >
                <span>💬</span>
                <span>Feedback</span>
              </button>

              {/* Shopping Cart Button */}
              <button
                onClick={() => setTab('shopping')}
                className="relative px-3.5 py-2.5 rounded-2xl border border-stone-200 bg-white hover:bg-stone-50 transition shadow-card flex items-center gap-2 text-xs font-bold text-stone-700 active:scale-95"
              >
                <span>🛒</span>
                <span>Shopping</span>
                {unboughtShoppingCount > 0 && (
                  <span className="w-5 h-5 rounded-full bg-orange-600 text-white text-[10px] font-extrabold flex items-center justify-center">
                    {unboughtShoppingCount}
                  </span>
                )}
              </button>

              {/* Google Sign-In Status / Button */}
              {user && user.is_logged_in ? (
                <div className="flex items-center gap-2.5 pl-3 border-l border-stone-200 bg-white px-3.5 py-2 rounded-2xl border shadow-card">
                  {user.picture ? (
                    <img src={user.picture} alt={user.name} className="w-7 h-7 rounded-full border border-orange-400 object-cover" />
                  ) : (
                    <div className="w-7 h-7 rounded-full bg-orange-600 text-white font-extrabold text-xs flex items-center justify-center">
                      {user.name ? user.name.charAt(0) : 'U'}
                    </div>
                  )}
                  <div className="text-left">
                    <span className="text-xs font-bold text-stone-800 block leading-tight">{user.name}</span>
                    <span className="text-[10px] text-orange-600 font-semibold">Gmail Cloud Synced ☁️</span>
                  </div>
                  <button
                    onClick={handleLogout}
                    className="text-stone-400 hover:text-red-500 text-[11px] font-bold ml-1.5 p-0.5"
                    title="Sign out"
                  >
                    ✕
                  </button>
                </div>
              ) : (
                <div className="flex items-center gap-2 pl-2 border-l border-stone-200">
                  <div id="google-signin-btn"></div>
                  <button
                    onClick={() => setAuthModalOpen(true)}
                    className="sm:hidden px-3 py-2 rounded-xl bg-stone-900 text-white text-xs font-bold"
                  >
                    Sign In
                  </button>
                </div>
              )}
            </div>
          </header>

          {/* =============================================================== */}
          {/* MANDATORY GOOGLE SIGN-IN NOTICE BANNER (WHEN GUEST)            */}
          {/* =============================================================== */}
          {(!user || !user.is_logged_in) && (
            <div className="mb-6 p-4 rounded-2xl bg-gradient-to-r from-amber-500/10 via-orange-500/10 to-rose-500/10 border border-orange-500/30 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 to-amber-500 text-white flex items-center justify-center text-lg flex-shrink-0 shadow-sm">
                  🔒
                </div>
                <div>
                  <h4 className="text-xs sm:text-sm font-extrabold text-stone-900">Sign in with Google required before modifying kitchen</h4>
                  <p className="text-[11px] sm:text-xs text-stone-600 mt-0.5">Connect your Google account to customize ingredients, edit shelf-life, save home recipes, and sync across your devices.</p>
                </div>
              </div>
              <button
                onClick={() => setAuthModalOpen(true)}
                className="px-4 py-2 rounded-xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-bold transition shadow-sm self-start sm:self-auto active:scale-95 whitespace-nowrap flex items-center gap-1.5"
              >
                <span>Sign in with Google</span>
                <span>→</span>
              </button>
            </div>
          )}

          {/* =============================================================== */}
          {/* BENTO DASHBOARD WIDGETS (Stats, Freshness, & Pro Roadmap)      */}
          {/* =============================================================== */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-3.5 mb-6">
            {/* Widget 1: Food Waste Rescued */}
            <div className="p-4 rounded-2xl bg-white border border-stone-200/90 shadow-card flex flex-col justify-between relative overflow-hidden group hover:shadow-card-hover transition">
              <div className="flex justify-between items-start">
                <span className="text-[11px] font-extrabold uppercase tracking-wider text-orange-700 flex items-center gap-1">
                  <span>🌱</span> Zero-Waste Savings
                </span>
                <span className="text-[10px] px-2 py-0.5 rounded-full bg-orange-50 text-orange-700 font-bold border border-orange-200">
                  Total Rescued
                </span>
              </div>
              <div className="my-2.5">
                <div className="text-2xl font-extrabold text-stone-900 tracking-tight">
                  ~${data.stats.money_saved} <span className="text-xs font-semibold text-stone-400">saved</span>
                </div>
                <p className="text-xs text-stone-500 mt-0.5">
                  <strong>{data.stats.rescued_count}</strong> pantry items saved from spoiling.
                </p>
              </div>
              <div className="w-full bg-stone-100 rounded-full h-1.5 overflow-hidden">
                <div className="bg-orange-500 h-1.5 rounded-full transition-all duration-500" style={{ width: `${Math.min(100, Math.max(15, data.stats.rescued_count * 10))}%` }}></div>
              </div>
            </div>

            {/* Widget 2: Pantry Freshness Health */}
            <div className="p-4 rounded-2xl bg-white border border-stone-200/90 shadow-card flex flex-col justify-between relative overflow-hidden group hover:shadow-card-hover transition">
              <div className="flex justify-between items-start">
                <span className="text-[11px] font-extrabold uppercase tracking-wider text-stone-600 flex items-center gap-1">
                  <span>🥬</span> Pantry Stock Health
                </span>
                <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold border ${expiringCount > 0 ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-green-50 text-green-700 border-green-200'}`}>
                  {expiringCount > 0 ? `${expiringCount} to use soon` : 'All fresh'}
                </span>
              </div>
              <div className="my-2.5">
                <div className="text-2xl font-extrabold text-stone-900 tracking-tight">
                  {data.pantry.length} <span className="text-xs font-semibold text-stone-400">items in kitchen</span>
                </div>
                <p className="text-xs text-stone-500 mt-0.5">
                  {expiringCount > 0 ? `⚠️ ${expiringCount} items expiring within 4 days.` : 'Your ingredients are in great shape.'}
                </p>
              </div>
              <div className="w-full bg-stone-100 rounded-full h-1.5 overflow-hidden flex">
                <div className="bg-green-500 h-1.5 rounded-l-full" style={{ width: `${Math.max(10, 100 - (expiringCount * 20))}%` }}></div>
                <div className="bg-amber-400 h-1.5 rounded-r-full" style={{ width: `${expiringCount * 20}%` }}></div>
              </div>
            </div>

            {/* Widget 3: Pro Roadmap & Daily Usage */}
            <div className="p-4 rounded-2xl bg-white border border-stone-200/90 shadow-card flex flex-col justify-between relative overflow-hidden group hover:shadow-card-hover transition">
              <div className="flex justify-between items-center">
                <span className="text-[11px] font-extrabold uppercase tracking-wider text-amber-700 flex items-center gap-1">
                  <span>⚡</span> Daily AI Chef Usage
                </span>
                <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-50 text-amber-800 font-bold border border-amber-200">
                  Free Tier (10/day)
                </span>
              </div>
              <div className="my-2.5">
                <div className="text-2xl font-extrabold text-stone-900 tracking-tight">
                  {data.remaining_today !== undefined ? data.remaining_today : 10} <span className="text-xs font-semibold text-stone-400">recipes left today</span>
                </div>
                <p className="text-[11px] text-stone-500 mt-0.5">
                  <span className="font-bold text-orange-600">Pro tier coming soon:</span> Unlimited recipes & AI camera bill/fridge scanner.
                </p>
              </div>
              <div className="w-full bg-stone-100 rounded-full h-1.5 overflow-hidden">
                <div className="bg-gradient-to-r from-orange-500 to-amber-500 h-1.5 rounded-full" style={{ width: `${Math.max(10, ((data.remaining_today || 10) / 10) * 100)}%` }}></div>
              </div>
            </div>
          </div>

          {/* =============================================================== */}
          {/* NAVIGATION TABS (Segmented Control)                             */}
          {/* =============================================================== */}
          <div className="flex space-x-1.5 p-1 bg-stone-200/70 rounded-2xl mb-6 max-w-xl">
            {[
              { id: 'cook', icon: '🍳', label: 'Suggest Meals' },
              { id: 'kitchen', icon: '🧺', label: `My Kitchen (${data.pantry.length})` },
              { id: 'shopping', icon: '🛒', label: `Shopping (${data.shopping.length})` },
              { id: 'history', icon: '🕘', label: 'Cook History' },
            ].map(item => (
              <button
                key={item.id}
                onClick={() => setTab(item.id)}
                className={`flex-1 flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl text-xs font-bold transition active:scale-95 ${
                  tab === item.id
                    ? 'bg-white text-stone-900 shadow-sm'
                    : 'text-stone-600 hover:text-stone-900'
                }`}
              >
                <span>{item.icon}</span>
                <span className="hidden sm:inline">{item.label}</span>
              </button>
            ))}
          </div>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-2.5 px-4 py-3 bg-stone-900/95 backdrop-blur-md text-white text-xs font-bold rounded-2xl shadow-2xl animate-fade-in border border-stone-700">
              <span className="w-5 h-5 rounded-full bg-orange-500/20 text-orange-400 flex items-center justify-center text-xs">{toast.icon}</span>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* =============================================================== */}
          {/* TAB 1: SUGGEST MEALS                                            */}
          {/* =============================================================== */}
          {tab === 'cook' && (
            <div className="space-y-6">
              {/* Recipe Prompt & Filter Form */}
              <div className="p-5 sm:p-7 rounded-3xl bg-white border border-stone-200/90 shadow-card space-y-5">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🍲</span>

    // =========================================================================
    // Component: Edit Pantry Item Modal (Name, Expiry, Star)
    // =========================================================================
    function EditPantryModal({ item, onClose, onSaved, showToast }) {
      const [name, setName] = useState(item.name || '');
      const [expiresAt, setExpiresAt] = useState(item.expires_at || '');
      const [useSoon, setUseSoon] = useState(Boolean(item.use_soon));
      const [saving, setSaving] = useState(false);

      const addDaysToToday = (days) => {
        const d = new Date();
        d.setDate(d.getDate() + days);
        setExpiresAt(d.toISOString().slice(0, 10));
      };

      const handleSave = async (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        setSaving(true);
        try {
          const res = await fetch(`/api/pantry/${item.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: name.trim(),
              expires_at: expiresAt || null,
              use_soon: useSoon
            })
          });
          if (res.status === 401) {
            showToast('Sign in with Google required to save changes', '🔒');
            return;
          }
          showToast(`Updated "${name}" successfully!`);
          onSaved();
        } catch (err) {
          showToast('Failed to update ingredient', '❌');
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-200 space-y-4">
            <div className="flex justify-between items-start">
              <div>
                <h3 className="text-base font-extrabold text-stone-900">Edit Pantry Ingredient</h3>
                <p className="text-xs text-stone-500 mt-0.5">Update name, shelf life, or expiry priority.</p>
              </div>
              <button onClick={onClose} className="text-stone-400 hover:text-stone-700 font-bold p-1">✕</button>
            </div>

            <form onSubmit={handleSave} className="space-y-4">
              <div>
                <label className="text-xs font-bold text-stone-700 block mb-1">Ingredient Name</label>
                <input
                  type="text"
                  value={name}
                  onChange={e => setName(e.target.value)}
                  className="w-full text-xs font-semibold bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-stone-800 focus:outline-none focus:ring-2 focus:ring-orange-500"
                  required
                />
              </div>

              <div>
                <label className="text-xs font-bold text-stone-700 block mb-1">Expiration Date (Shelf Life)</label>
                <input
                  type="date"
                  value={expiresAt}
                  onChange={e => setExpiresAt(e.target.value)}
                  className="w-full text-xs font-semibold bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-stone-800 focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
                {/* Quick Expiry Buttons */}
                <div className="flex flex-wrap gap-1.5 mt-2">
                  <button
                    type="button"
                    onClick={() => addDaysToToday(3)}
                    className="px-2 py-1 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 text-[10px] font-bold"
                  >
                    +3 Days
                  </button>
                  <button
                    type="button"
                    onClick={() => addDaysToToday(7)}
                    className="px-2 py-1 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 text-[10px] font-bold"
                  >
                    +7 Days
                  </button>
                  <button
                    type="button"
                    onClick={() => addDaysToToday(14)}
                    className="px-2 py-1 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 text-[10px] font-bold"
                  >
                    +14 Days
                  </button>
                  <button
                    type="button"
                    onClick={() => setExpiresAt('')}
                    className="px-2 py-1 rounded-lg bg-red-50 hover:bg-red-100 text-red-700 text-[10px] font-bold"
                  >
                    Clear Date
                  </button>
                </div>
              </div>

              <label className="flex items-center gap-2 p-3 rounded-xl border border-stone-200 bg-stone-50 cursor-pointer text-xs">
                <input
                  type="checkbox"
                  checked={useSoon}
                  onChange={e => setUseSoon(e.target.checked)}
                  className="rounded border-stone-300 text-orange-600 focus:ring-orange-500 w-4 h-4"
                />
                <span className="font-bold text-stone-800">⭐ Prioritize using this item first (Use Soon)</span>
              </label>

              <div className="flex gap-2 pt-2 border-t border-stone-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="py-2.5 px-4 rounded-xl border border-stone-200 text-xs font-bold text-stone-600 hover:bg-stone-50 flex-1"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="py-2.5 px-4 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-xs font-extrabold flex-1 shadow-sm active:scale-95"
                >
                  {saving ? 'Saving…' : 'Save Changes'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // Component: Edit Home Recipe Modal (Name, Pantry Picker & Ingredients List)
    // =========================================================================
    function EditDishModal({ dish, pantry, onClose, onSaved, showToast }) {
      const [name, setName] = useState(dish.name || '');
      const [ingredients, setIngredients] = useState(dish.ingredients || []);
      const [newIng, setNewIng] = useState('');
      const [saving, setSaving] = useState(false);
      const [proposing, setProposing] = useState(false);

      const addIngredient = (e) => {
        if (e) e.preventDefault();
        const trimmed = newIng.trim();
        if (!trimmed) return;
        if (!ingredients.map(i => i.toLowerCase()).includes(trimmed.toLowerCase())) {
          setIngredients([...ingredients, trimmed]);
        }
        setNewIng('');
      };

      const togglePantryIngredient = (pantryName) => {
        const trimmed = pantryName.trim();
        const exists = ingredients.some(i => i.toLowerCase() === trimmed.toLowerCase());
        if (exists) {
          setIngredients(ingredients.filter(i => i.toLowerCase() !== trimmed.toLowerCase()));
        } else {
          setIngredients([...ingredients, trimmed]);
        }
      };

      const handleProposeAi = async () => {
        if (!name.trim()) return;
        setProposing(true);
        try {
          const res = await fetch('/api/dishes/propose', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name.trim() })
          });
          const json = await res.json();
          if (json.ok && json.ingredients && json.ingredients.length) {
            const currentLower = ingredients.map(i => i.toLowerCase());
            const merged = [...ingredients];
            json.ingredients.forEach(item => {
              if (!currentLower.includes(item.toLowerCase())) {
                merged.push(item);
                currentLower.push(item.toLowerCase());
              }
            });
            setIngredients(merged);
            showToast(`Added ${json.ingredients.length} typical ingredients! ✨`);
          }
        } catch (e) {
          showToast('Could not fetch AI suggestions', '❌');
        } finally {
          setProposing(false);
        }
      };

      const removeIngredient = (ingToRemove) => {
        setIngredients(ingredients.filter(i => i !== ingToRemove));
      };

      const handleSave = async (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        setSaving(true);
        try {
          const res = await fetch(`/api/dishes/${dish.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: name.trim(),
              ingredients: ingredients
            })
          });
          if (res.status === 401) {
            showToast('Sign in with Google required to save changes', '🔒');
            return;
          }
          showToast(`Updated "${name}" successfully!`);
          onSaved();
        } catch (err) {
          showToast('Failed to update recipe', '❌');
        } finally {
          setSaving(false);
        }
      };

      const availablePantry = pantry || [];

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-stone-200 space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-start">
              <div>
                <h3 className="text-base font-extrabold text-stone-900">Edit Home Recipe</h3>
                <p className="text-xs text-stone-500 mt-0.5">Customize dish name and add or remove ingredients.</p>
              </div>
              <button onClick={onClose} className="text-stone-400 hover:text-stone-700 font-bold p-1">✕</button>
            </div>

            <form onSubmit={handleSave} className="space-y-4">
              <div>
                <label className="text-xs font-bold text-stone-700 block mb-1">Dish Name</label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={name}
                    onChange={e => setName(e.target.value)}
                    className="flex-1 text-xs font-semibold bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-stone-800 focus:outline-none focus:ring-2 focus:ring-orange-500"
                    required
                  />
                  <button
                    type="button"
                    onClick={handleProposeAi}
                    disabled={proposing || !name.trim()}
                    className="py-2 px-3 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300 text-xs font-bold whitespace-nowrap"
                  >
                    {proposing ? 'Finding…' : '✨ Ask AI'}
                  </button>
                </div>
              </div>

              {/* Quick Pick from Pantry */}
              {availablePantry.length > 0 && (
                <div className="space-y-1">
                  <label className="text-[11px] font-extrabold text-stone-500 uppercase tracking-wider block">
                    Quick-Pick from Your Pantry:
                  </label>
                  <div className="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto p-2 rounded-xl bg-stone-50 border border-stone-200">
                    {availablePantry.map(p => {
                      const isSelected = ingredients.some(i => i.toLowerCase() === p.name.toLowerCase());
                      return (
                        <button
                          key={p.id}
                          type="button"
                          onClick={() => togglePantryIngredient(p.name)}
                          className={`px-2 py-0.5 rounded-lg text-xs font-semibold transition ${
                            isSelected
                              ? 'bg-orange-600 text-white shadow-sm'
                              : 'bg-white text-stone-700 border border-stone-200 hover:bg-orange-50'
                          }`}
                        >
                          {isSelected ? '✓ ' : '+ '}{p.name}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              <div>
                <label className="text-xs font-bold text-stone-700 block mb-1">
                  Ingredients ({ingredients.length})
                </label>
                <div className="flex flex-wrap gap-1.5 p-3 rounded-2xl bg-stone-50 border border-stone-200 min-h-[64px] max-h-40 overflow-y-auto">
                  {ingredients.map(ing => (
                    <span
                      key={ing}
                      className="px-2.5 py-1 rounded-lg bg-white border border-stone-200 text-stone-800 text-xs font-semibold flex items-center gap-1.5 shadow-sm"
                    >
                      <span>{ing}</span>
                      <button
                        type="button"
                        onClick={() => removeIngredient(ing)}
                        className="text-stone-400 hover:text-red-500 font-bold"
                        title="Remove ingredient"
                      >
                        ✕
                      </button>
                    </span>
                  ))}
                  {ingredients.length === 0 && (
                    <span className="text-xs text-stone-400 italic">No ingredients added yet. Add some below!</span>
                  )}
                </div>
              </div>

              {/* Add ingredient input */}
              <div className="flex gap-2">
                <input
                  type="text"
                  value={newIng}
                  onChange={e => setNewIng(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addIngredient(); } }}
                  placeholder="Type an ingredient (e.g. garlic, cumin, paneer)"
                  className="flex-1 text-xs font-semibold bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-stone-800 focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
                <button
                  type="button"
                  onClick={addIngredient}
                  className="py-2.5 px-4 rounded-xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-bold"
                >
                  ＋ Add
                </button>
              </div>

              <div className="flex gap-2 pt-2 border-t border-stone-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="py-2.5 px-4 rounded-xl border border-stone-200 text-xs font-bold text-stone-600 hover:bg-stone-50 flex-1"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="py-2.5 px-4 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-xs font-extrabold flex-1 shadow-sm active:scale-95"
                >
                  {saving ? 'Saving…' : 'Save Changes'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // Component: Pantry Section with InFoodAI Freshness Progress Bars & Edit
    // =========================================================================
    function PantrySection({ items, filter, setFilter, onRefresh, onEditItem, requireAuth, showToast }) {
      const [input, setInput] = useState('');

      const handleAdd = async (e) => {
        e.preventDefault();
        if (!requireAuth('add pantry items')) return;
        const names = input.split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
        if (!names.length) return;
        const res = await fetch('/api/pantry', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ names })
        });
        if (res.status === 401) {
          showToast('Please sign in with Google to add items', '🔒');
          return;
        }
        setInput('');
        showToast(`Added ${names.length} pantry items!`);
        onRefresh();
      };

      const handleRemove = async (id) => {
        if (!requireAuth('remove pantry items')) return;
        const res = await fetch('/api/pantry', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids: [id] })
        });
        if (res.status === 401) {
          showToast('Please sign in with Google to remove items', '🔒');
          return;
        }
        showToast('Removed item');
        onRefresh();
      };

      const toggleSoon = async (id, current) => {
        if (!requireAuth('star items')) return;
        const res = await fetch(`/api/pantry/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ use_soon: !current })
        });
        if (res.status === 401) {
          showToast('Please sign in with Google to modify items', '🔒');
          return;
        }
        onRefresh();
      };

      return (
        <div className="space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <h3 className="text-sm font-extrabold text-stone-800">Fresh Food Inventory & Expiry Tracker</h3>
              <p className="text-xs text-stone-500 mt-0.5">Cook AI tracks shelf-life and notifies you when ingredients near expiration so you can rescue them in time.</p>
            </div>
          </div>

          <form onSubmit={handleAdd} className="flex gap-2">
            <input
              type="text"
              value={input}
              onChange={e => setInput(e.target.value)}
              placeholder="e.g. fresh chicken, tomato, basmati rice, spinach"
              className="flex-1 text-xs font-semibold bg-white border border-stone-200 rounded-2xl px-4 py-3 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-orange-500 shadow-card"
            />
            <button type="submit" className="py-3 px-5 rounded-2xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-extrabold shadow-sm active:scale-95">
              ＋ Add
            </button>
          </form>

          {items.length === 0 ? (
            <div className="p-10 rounded-3xl bg-white border border-stone-200 text-center space-y-2.5">
              <span className="text-4xl">🧺</span>
              <h4 className="text-sm font-extrabold text-stone-800">Your pantry is currently empty</h4>
              <p className="text-xs text-stone-400 max-w-sm mx-auto">Add ingredients using the input box above to start getting recipe recommendations.</p>

          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3.5">
              {items.map(item => {
                const status = item.expiry_status || {};
                const badgeColor = status.color === 'red' ? 'bg-red-50 text-red-700 border-red-200' : status.color === 'amber' ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-green-50 text-green-700 border-green-200';
                const barColor = status.color === 'red' ? 'bg-red-500' : status.color === 'amber' ? 'bg-amber-400' : 'bg-green-500';

                return (
                  <div key={item.id} className="p-3.5 rounded-2xl bg-white border border-stone-200/90 shadow-card hover:shadow-card-hover transition flex flex-col justify-between space-y-2.5 group">
                    <div className="flex items-start justify-between">
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => toggleSoon(item.id, item.use_soon)}
                          className={`text-base ${item.use_soon ? 'text-amber-500' : 'text-stone-300 hover:text-amber-400'}`}
                          title="Star to prioritize using this item up today"
                        >
                          ⭐
                        </button>
                        <div>
                          <div className="text-xs font-extrabold text-stone-900">{item.name}</div>
                          <span className={`inline-block px-1.5 py-0.2 rounded-md text-[9px] font-bold border ${badgeColor} mt-0.5`}>
                            {status.label || 'Fresh'}
                          </span>
                        </div>
                      </div>
                      
                      {/* Edit & Remove Buttons */}
                      <div className="flex items-center gap-1">
                        <button
                          onClick={() => onEditItem(item)}
                          className="text-stone-400 hover:text-orange-600 text-xs p-1"
                          title="Edit ingredient & shelf life"
                        >
                          ✏️
                        </button>
                        <button
                          onClick={() => handleRemove(item.id)}
                          className="text-stone-300 hover:text-red-500 text-xs p-1"
                          title="Remove item"
                        >
                          ✕
                        </button>
                      </div>
                    </div>

                    {/* Freshness Progress Bar */}
                    <div className="w-full bg-stone-100 rounded-full h-1 overflow-hidden">
                      <div className={`${barColor} h-1 rounded-full transition-all duration-300`} style={{ width: status.color === 'red' ? '20%' : status.color === 'amber' ? '50%' : '90%' }}></div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // Component: Home Dishes Section with Pantry Quick-Picker & AI Autofill
    // =========================================================================
    function HomeDishesSection({ dishes, pantry, onRefresh, onEditDish, requireAuth, showToast }) {
      const [name, setName] = useState('');
      const [ingredients, setIngredients] = useState([]);
      const [newIng, setNewIng] = useState('');
      const [proposing, setProposing] = useState(false);
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [pantrySearch, setPantrySearch] = useState('');

      const handleProposeAi = async () => {
        if (!name.trim()) {
          showToast('Please type a dish name first', 'ℹ️');
          return;
        }
        if (!requireAuth('propose ingredients')) return;
        setProposing(true);
        try {
          const res = await fetch('/api/dishes/propose', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name.trim() })
          });
          const json = await res.json();
          if (json.ok && json.ingredients && json.ingredients.length) {
            const currentLower = ingredients.map(i => i.toLowerCase());
            const merged = [...ingredients];
            json.ingredients.forEach(item => {
              if (!currentLower.includes(item.toLowerCase())) {
                merged.push(item);
                currentLower.push(item.toLowerCase());
              }
            });
            setIngredients(merged);
            showToast(`Added ${json.ingredients.length} typical ingredients! ✨`);
          } else {
            showToast('No typical ingredients found. Pick from your pantry below!', 'ℹ️');
          }
        } catch (e) {
          showToast('Could not fetch AI suggestions', '❌');
        } finally {
          setProposing(false);
        }
      };

      const togglePantryIngredient = (pantryName) => {
        const trimmed = pantryName.trim();
        const exists = ingredients.some(i => i.toLowerCase() === trimmed.toLowerCase());
        if (exists) {
          setIngredients(ingredients.filter(i => i.toLowerCase() !== trimmed.toLowerCase()));
        } else {
          setIngredients([...ingredients, trimmed]);
        }
      };

      const addCustomIngredient = (e) => {
        if (e) e.preventDefault();
        const trimmed = newIng.trim();
        if (!trimmed) return;
        if (!ingredients.some(i => i.toLowerCase() === trimmed.toLowerCase())) {
          setIngredients([...ingredients, trimmed]);
        }
        setNewIng('');
      };

      const removeIngredient = (ingToRemove) => {
        setIngredients(ingredients.filter(i => i !== ingToRemove));
      };

      const handleSaveDish = async (e) => {
        if (e) e.preventDefault();
        if (!name.trim()) {
          showToast('Please enter a dish name', '⚠️');
          return;
        }
        if (!requireAuth('save recipe')) return;
        try {
          const res = await fetch('/api/dishes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: name.trim(),
              ingredients: ingredients
            })
          });
          if (res.status === 401) {
            showToast('Please sign in with Google to save recipe', '🔒');
            return;
          }
          showToast('Home recipe saved! ⭐');
          setName('');
          setIngredients([]);
          setIsFormOpen(false);
          onRefresh();
        } catch (err) {
          showToast('Failed to save recipe', '❌');
        }
      };

      const handleDeleteDish = async (id) => {
        if (!requireAuth('delete recipe')) return;
        const res = await fetch(`/api/dishes/${id}`, { method: 'DELETE' });
        if (res.status === 401) {
          showToast('Please sign in with Google to delete recipe', '🔒');
          return;
        }
        showToast('Dish deleted');
        onRefresh();
      };

      const availablePantry = pantry || [];
      const filteredPantry = pantrySearch.trim()
        ? availablePantry.filter(p => p.name.toLowerCase().includes(pantrySearch.toLowerCase()))
        : availablePantry;

      return (
        <div className="space-y-4">
          <div className="p-4 rounded-2xl bg-orange-50/80 border border-orange-200 space-y-1">
            <div className="flex items-center gap-2">
              <span className="text-xl">🍲</span>
              <h3 className="text-sm font-black text-stone-900">Your Family's Home Recipe Book</h3>
            </div>
            <p className="text-xs text-stone-600 font-medium leading-relaxed">
              <strong>The core of Cook AI:</strong> Save your everyday family favorites. Cook AI prioritizes matching these first whenever you ask what to cook, so you get familiar comfort food without random internet clutter!
            </p>
          </div>

          {/* Add Recipe Trigger / Form */}
          {!isFormOpen ? (
            <button
              onClick={() => setIsFormOpen(true)}
              className="w-full py-3.5 px-4 rounded-2xl border-2 border-dashed border-orange-300 hover:border-orange-500 bg-orange-50/40 hover:bg-orange-50 text-orange-800 text-xs font-extrabold flex items-center justify-center gap-2 transition"
            >
              <span className="text-base">＋</span>
              <span>Add a Home Recipe (Pick Pantry Items or Ask AI)</span>
            </button>
          ) : (
            <div className="p-5 rounded-3xl bg-white border-2 border-orange-200 shadow-card space-y-4 animate-fade-in">
              <div className="flex justify-between items-center">
                <h4 className="text-sm font-black text-stone-900">Add New Home Recipe</h4>
                <button
                  type="button"
                  onClick={() => { setIsFormOpen(false); setName(''); setIngredients([]); }}
                  className="text-stone-400 hover:text-stone-700 text-xs font-bold"
                >
                  ✕ Close
                </button>
              </div>

              {/* Recipe Name */}
              <div>
                <label className="text-xs font-bold text-stone-700 block mb-1">Recipe Name *</label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={name}
                    onChange={e => setName(e.target.value)}
                    placeholder="e.g. Lentil Soup, Family Pasta, Vegetable Stir-Fry"
                    className="flex-1 text-xs font-semibold bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-orange-500"
                  />
                  <button
                    type="button"
                    onClick={handleProposeAi}
                    disabled={proposing || !name.trim()}
                    className="py-2.5 px-4 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300 text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap disabled:opacity-50"
                    title="Search AI for typical ingredients"
                  >
                    <span>{proposing ? '⏳ Finding…' : '✨ Ask AI Ingredients'}</span>
                  </button>
                </div>
              </div>

              {/* Quick Pick from Pantry */}
              {availablePantry.length > 0 && (
                <div className="space-y-1.5">
                  <div className="flex justify-between items-center">
                    <label className="text-[11px] font-extrabold text-stone-500 uppercase tracking-wider">
                      Quick-Pick from Your Pantry ({availablePantry.length} items available):
                    </label>
                    {availablePantry.length > 8 && (
                      <input
                        type="text"
                        value={pantrySearch}
                        onChange={e => setPantrySearch(e.target.value)}
                        placeholder="Filter pantry..."
                        className="text-[11px] px-2 py-0.5 rounded-lg border border-stone-200 bg-stone-50"
                      />
                    )}
                  </div>
                  <div className="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-2.5 rounded-2xl bg-stone-50 border border-stone-200/80">
                    {filteredPantry.map(p => {
                      const isSelected = ingredients.some(i => i.toLowerCase() === p.name.toLowerCase());
                      return (
                        <button
                          key={p.id}
                          type="button"
                          onClick={() => togglePantryIngredient(p.name)}
                          className={`px-2.5 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1 ${
                            isSelected
                              ? 'bg-orange-600 text-white shadow-sm'
                              : 'bg-white text-stone-700 border border-stone-200 hover:border-orange-300 hover:bg-orange-50/50'
                          }`}
                        >
                          <span>{isSelected ? '✓' : '＋'}</span>
                          <span>{p.name}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Add Custom Ingredient Input */}
              <div>
                <label className="text-[11px] font-extrabold text-stone-500 uppercase tracking-wider block mb-1">
                  Or Type Custom Ingredient / Spice:
                </label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={newIng}
                    onChange={e => setNewIng(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addCustomIngredient(); } }}
                    placeholder="e.g. olive oil, black pepper, oregano"
                    className="flex-1 text-xs font-semibold bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-orange-500"
                  />
                  <button
                    type="button"
                    onClick={addCustomIngredient}
                    className="py-2 px-3.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-bold"
                  >
                    ＋ Add
                  </button>
                </div>
              </div>

              {/* Selected Ingredients Tag List */}
              <div className="space-y-1.5 pt-1">
                <div className="flex justify-between items-center">
                  <label className="text-xs font-extrabold text-stone-800">
                    Recipe Ingredients ({ingredients.length})
                  </label>
                  {ingredients.length > 0 && (
                    <button
                      type="button"
                      onClick={() => setIngredients([])}
                      className="text-[10px] text-stone-400 hover:text-red-500 font-bold"
                    >
                      Clear all
                    </button>
                  )}
                </div>
                <div className="flex flex-wrap gap-1.5 p-3 rounded-2xl bg-orange-50/40 border border-orange-200/80 min-h-[50px]">
                  {ingredients.map(ing => (
                    <span
                      key={ing}
                      className="px-2.5 py-1 rounded-xl bg-white border border-orange-200 text-orange-950 text-xs font-bold flex items-center gap-1.5 shadow-sm"
                    >
                      <span>{ing}</span>
                      <button
                        type="button"
                        onClick={() => removeIngredient(ing)}
                        className="text-stone-400 hover:text-red-600 font-bold ml-0.5"
                      >
                        ✕
                      </button>
                    </span>
                  ))}
                  {ingredients.length === 0 && (
                    <span className="text-xs text-stone-400 italic">No ingredients added yet. Pick from your pantry above or click "Ask AI".</span>
                  )}
                </div>
              </div>

              {/* Form Actions */}
              <div className="flex gap-2 pt-2 border-t border-stone-100">
                <button
                  type="button"
                  onClick={() => { setIsFormOpen(false); setName(''); setIngredients([]); }}
                  className="py-2.5 px-4 rounded-xl border border-stone-200 text-xs font-bold text-stone-600 hover:bg-stone-50"
                >
                  Cancel
                </button>
                <button
                  type="button"
                  onClick={handleSaveDish}
                  className="py-2.5 px-6 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-xs font-extrabold shadow-sm active:scale-95 flex-1"
                >
                  💾 Save Home Recipe
                </button>
              </div>
            </div>
          )}

          {/* Dishes List with Ingredient Chips & Edit Button */}
          <div className="space-y-3">
            {dishes.map(d => (
              <div key={d.id} className="p-4 rounded-2xl bg-white border border-stone-200/90 shadow-card space-y-2.5">
                <div className="flex items-center justify-between">
                  <h4 className="text-sm font-extrabold text-stone-900">{d.name}</h4>
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => onEditDish(d)}
                      className="px-2.5 py-1 rounded-xl bg-orange-50 hover:bg-orange-100 text-orange-700 border border-orange-200 text-xs font-bold transition flex items-center gap-1"
                      title="Edit dish name and ingredients"
                    >
                      <span>✏️</span>
                      <span>Edit</span>
                    </button>
                    <button
                      onClick={() => handleDeleteDish(d.id)}
                      className="text-stone-300 hover:text-red-500 text-xs p-1"
                      title="Delete recipe"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {/* Display ingredients as chips */}
                <div>
                  <div className="text-[10px] uppercase font-extrabold text-stone-400 tracking-wider mb-1">
                    Ingredients ({d.ingredients.length}):
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {d.ingredients && d.ingredients.length > 0 ? (
                      d.ingredients.map((ing, idx) => (
                        <span
                          key={idx}
                          className="px-2.5 py-0.5 rounded-lg bg-stone-100 border border-stone-200/60 text-stone-800 text-[11px] font-semibold"
                        >
                          {ing}
                        </span>
                      ))
                    ) : (
                      <span className="text-xs text-stone-400 italic">No ingredients specified. Tap Edit to add them.</span>
                    )}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // Component: Shopping List Section (with WhatsApp Copy)
    // =========================================================================
    function ShoppingSection({ items, onRefresh, requireAuth, showToast }) {
      const [input, setInput] = useState('');

      const handleAdd = async (e) => {
        e.preventDefault();
        if (!requireAuth('add shopping items')) return;
        const names = input.split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
        if (!names.length) return;
        const res = await fetch('/api/shopping', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ names })
        });
        if (res.status === 401) {
          showToast('Please sign in with Google to add items', '🔒');
          return;
        }
        setInput('');
        showToast(`Added ${names.length} items to shopping list!`);
        onRefresh();
      };

      const toggleBought = async (id, current) => {
        if (!requireAuth('toggle shopping items')) return;
        const res = await fetch(`/api/shopping/${id}/toggle`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bought: !current })
        });
        if (res.status === 401) {
          showToast('Please sign in with Google to toggle items', '🔒');
          return;
        }
        onRefresh();
      };

      const handleMoveToPantry = async () => {
        if (!requireAuth('move items to pantry')) return;
        const res = await fetch('/api/shopping/to-pantry', { method: 'POST' });
        if (res.status === 401) {
          showToast('Please sign in with Google', '🔒');
          return;
        }
        const json = await res.json();
        showToast(`Moved ${json.moved} items into your pantry! 📦`);
        onRefresh();
      };

      const handleClearBought = async () => {
        if (!requireAuth('clear shopping items')) return;
        const res = await fetch('/api/shopping/clear', { method: 'DELETE' });
        if (res.status === 401) {
          showToast('Please sign in with Google', '🔒');
          return;
        }
        showToast('Cleared bought items');
        onRefresh();
      };

      const handleCopyAsText = () => {
        const unbought = items.filter(i => !i.bought).map(i => `• ${i.name}`).join('\n');
        if (!unbought) {
          showToast('No unbought items to copy', '⚠️');
          return;
        }
        const text = `🛒 Cook AI Shopping List:\n${unbought}`;
        navigator.clipboard.writeText(text);
        showToast('✓ Copied to clipboard! Ready to paste in WhatsApp/SMS');
      };

      const boughtCount = items.filter(i => i.bought).length;

      return (
        <div className="space-y-4 max-w-xl">
          <div>
            <h3 className="text-sm font-extrabold text-stone-800">Smart Grocery Shopping List</h3>
            <p className="text-xs text-stone-500 mt-0.5">Collects missing ingredients from recipes. Check off items as you buy and move them directly into your pantry.</p>
          </div>

          <form onSubmit={handleAdd} className="flex gap-2">
            <input
              type="text"
              value={input}
              onChange={e => setInput(e.target.value)}
              placeholder="e.g. coriander, paneer, olive oil"
              className="flex-1 text-xs font-semibold bg-white border border-stone-200 rounded-2xl px-4 py-3 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-orange-500 shadow-card"
            />
            <button type="submit" className="py-3 px-5 rounded-2xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-extrabold shadow-sm active:scale-95">
              ＋ Add
            </button>
          </form>

          {items.length > 0 && (
            <div className="flex flex-wrap gap-2 pt-1">
              <button
                onClick={handleCopyAsText}
                className="py-2.5 px-4 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-800 text-xs font-extrabold transition flex items-center gap-1.5 active:scale-95"
              >
                <span>📋</span> Copy as Text (WhatsApp / SMS)
              </button>
              {boughtCount > 0 && (
                <>
                  <button
                    onClick={handleMoveToPantry}
                    className="py-2.5 px-4 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-xs font-extrabold transition active:scale-95"
                  >
                    📦 Move {boughtCount} to Pantry
                  </button>
                  <button
                    onClick={handleClearBought}
                    className="py-2.5 px-4 rounded-xl border border-stone-200 hover:bg-stone-100 text-stone-600 text-xs font-bold transition active:scale-95"
                  >
                    Clear Bought
                  </button>
                </>
              )}
            </div>
          )}

          {items.length === 0 ? (
            <div className="p-10 rounded-3xl bg-white border border-stone-200 text-center text-xs text-stone-400">
              Your shopping list is empty. Add items above or tap "+ 🛒" on any "One step away" recipe!
            </div>
          ) : (
            <div className="space-y-2">
              {items.map(item => (
                <label
                  key={item.id}
                  className={`flex items-center justify-between p-3.5 rounded-2xl border transition cursor-pointer text-xs ${
                    item.bought ? 'bg-stone-50 border-stone-200 text-stone-400 line-through' : 'bg-white border-stone-200 text-stone-800 shadow-card'
                  }`}
                >
                  <span className="font-bold">{item.name}</span>
                  <input
                    type="checkbox"
                    checked={item.bought}
                    onChange={() => toggleBought(item.id, item.bought)}
                    className="rounded border-stone-300 text-orange-600 focus:ring-orange-500 w-4 h-4"
                  />
                </label>
              ))}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // Component: History Section & Cumulative Savings Tracker
    // =========================================================================
    function HistorySection({ stats, showToast }) {
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch('/api/history')
          .then(r => r.json())
          .then(d => setHistory(d.history || []))
          .catch(() => {})
          .finally(() => setLoading(false));
      }, []);

      return (
        <div className="space-y-6 max-w-xl">
          <div className="p-6 rounded-3xl bg-gradient-to-br from-stone-950 via-[#231713] to-[#361910] border border-orange-500/30 text-white shadow-card space-y-2.5">
            <span className="text-xs uppercase font-extrabold tracking-wider text-amber-400">Zero-Waste Tracker</span>
            <div className="flex items-baseline gap-2">
              <span className="text-3xl font-extrabold tracking-tight">~${stats.money_saved}</span>
              <span className="text-xs text-orange-200 font-bold">saved in prevented food waste</span>
            </div>
            <p className="text-xs text-orange-200/90 leading-relaxed">
              You have rescued <strong>{stats.rescued_count} pantry ingredients</strong> from spoiling by cooking them on time!
            </p>
          </div>

          <div>
            <h3 className="text-sm font-extrabold text-stone-800 mb-1">Cooking History</h3>
            <p className="text-xs text-stone-500 mb-3">Record of meals you cooked. AI uses this to learn your preferred cuisines and avoid repeating recipes too soon.</p>

            {loading ? (
              <p className="text-xs text-stone-400">Loading history…</p>
            ) : history.length === 0 ? (
              <div className="p-8 rounded-3xl bg-white border border-stone-200 text-center text-xs text-stone-400">
                No cooking history yet. Tap "I Cooked This Meal" on any recipe card!
              </div>
            ) : (
              <div className="space-y-2">
                {history.map((h, idx) => (
                  <div key={idx} className="p-4 rounded-2xl bg-white border border-stone-200 shadow-card flex justify-between items-center text-xs">
                    <div>
                      <span className="font-extrabold text-stone-800">{h.name}</span>
                      <span className="text-[10px] text-stone-400 block mt-0.5">{h.cooked_at ? h.cooked_at.slice(0, 10) : ''}</span>
                    </div>
                    <span className="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-stone-100 text-stone-600 capitalize">
                      {h.source.replace('_', ' ')}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // Component: Cooked Deduction Modal
    // =========================================================================
    function CookedDeductionModal({ recipe, pantry, onClose, onConfirm }) {
      const [selectedIds, setSelectedIds] = useState([]);
      
      const rkeys = recipe.ingredients.map(i => i.toLowerCase());
      const availableInPantry = pantry.filter(p => rkeys.some(rk => rk.includes(p.name.toLowerCase()) || p.name.toLowerCase().includes(rk)));

      const toggleItem = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-200 space-y-4">
            <div>
              <h3 className="text-base font-extrabold text-stone-900">Did you use up any ingredients?</h3>
              <p className="text-xs text-stone-500 mt-0.5">Select items to deduct them from your pantry and record food rescue stats.</p>
            </div>

            {availableInPantry.length > 0 ? (
              <div className="space-y-1.5 max-h-48 overflow-y-auto">
                {availableInPantry.map(item => (
                  <label key={item.id} className="flex items-center justify-between p-3 rounded-xl border border-stone-200 hover:bg-stone-50 cursor-pointer text-xs">
                    <span className="font-bold text-stone-800">{item.name}</span>
                    <input
                      type="checkbox"
                      checked={selectedIds.includes(item.id)}
                      onChange={() => toggleItem(item.id)}
                      className="rounded border-stone-300 text-orange-600 focus:ring-orange-500 w-4 h-4"
                    />
                  </label>
                ))}
              </div>
            ) : (
              <p className="text-xs text-stone-400 italic">No matching ingredients found in pantry to deduct.</p>
            )}

            <div className="flex gap-2 pt-2 border-t border-stone-100">
              <button onClick={onClose} className="py-3 px-4 rounded-2xl border border-stone-200 text-xs font-bold text-stone-600 hover:bg-stone-50 flex-1">
                Skip
              </button>
              <button
                onClick={() => onConfirm(selectedIds)}
                className="py-3 px-4 rounded-2xl bg-orange-600 hover:bg-orange-700 text-white text-xs font-extrabold flex-1 shadow-sm active:scale-95"
              >
                Save & Deduct
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
